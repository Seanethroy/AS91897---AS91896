<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}OSC Burger Co.{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

</head>

<body>

<header class="site-header">

    <div class="nav-wrap">

        <a
            class="brand"
            href="{{ url_for('index') }}"
        >

            <span class="brand-mark">
                OB
            </span>

            <span>

                <strong>
                    OSC Burger Co.
                </strong>

                <small>
                    Student Fundraiser
                </small>

            </span>

        </a>

        <nav>

            <a href="{{ url_for('index') }}">
                Menu
            </a>

            <a href="{{ url_for('order_history') }}">
                Order History
            </a>

        </nav>

    </div>

</header>


<main class="page-shell">

    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            <section
                class="flash-list"
                aria-live="polite"
            >

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </section>

        {% endif %}

    {% endwith %}


    {% block content %}{% endblock %}

</main>


<footer class="site-footer">

    <p>
        OSC Burger Co.
    </p>

</footer>

</body>

</html>
